<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blockus Blocks</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div class="header">
        <div class="title">blockus Blocks</div>
        <button class="refresh-btn" id="refresh-btn" title="Refresh">↻ Refresh</button>
    </div>

    <div class="apikey-section">
        <div class="apikey-row">
            <span class="apikey-status" id="apikey-status">Free tier</span>
            <a href="#" class="pro-link" id="get-pro-link">Get Pro →</a>
        </div>
        <form class="apikey-input-group" id="apikey-form">
            <input
                type="password"
                class="apikey-input"
                id="apikey-input"
                placeholder="bk_live_…  (paste your API key to unlock Pro)"
            />
            <button class="apikey-btn" type="submit" id="save-apikey-btn">Unlock</button>
        </form>
    </div>

    <div class="toolbar-row">
        <input type="text" id="search-input" class="search-input" placeholder="Search blocks…" />
        <select id="pm-select" class="pm-select" title="Package manager used for install">
            <option value="pnpm">pnpm</option>
            <option value="npm">npm</option>
            <option value="yarn">yarn</option>
            <option value="bun">bun</option>
        </select>
    </div>
    <div class="categories" id="categories"></div>

    <div id="content">
        <div class="loading-state" id="loading-state">
            <p>⏳ Loading blocks…</p>
        </div>
        <div class="error-state" id="error-state" style="display: none;">
            <p class="error-message" id="error-message"></p>
            <button class="apikey-btn" id="retry-btn">Retry</button>
        </div>
        <div class="empty-state" id="empty-state" style="display: none;">
            <p>No blocks found.</p>
        </div>
        <div class="blocks-grid" id="blocks-grid" style="display: none;"></div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
